<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Tileworks Curling Games — Frosted Glass Arena Portal." />
  <meta name="theme-color" content="#f0f6fb" />
  <title>Tileworks Curling Games</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Curling Sheet with Real Physics Stones -->
  <canvas id="ice-canvas" class="ice-canvas" aria-hidden="true"></canvas>

  <!-- Arena Lighting Layer -->
  <div class="arena-lighting-overlay" aria-hidden="true"></div>

  <!-- Smooth Page Transition Shroud -->
  <div id="transition-curtain" class="transition-curtain" aria-hidden="true"></div>

  <!-- Cinematic Logo Sequence -->
  <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
    <div class="logo-stage" id="logo-stage">
      <img
        src="logo.png"
        alt="Tileworks Logo"
        id="intro-logo"
        class="intro-logo"
        width="220"
        height="220"
      />
    </div>
  </div>

  <!-- Master App Viewport -->
  <div class="app-viewport" id="app-viewport">
    <main class="hub-container" id="hub-container" aria-label="Tileworks Curling Games Hub">
      
      <!-- Arena Header -->
      <header class="hub-header" id="hub-header">
        <span class="arena-tag">Curling Arena</span>
        <h1 class="hub-title">Tileworks Games</h1>
      </header>

      <!-- 3x3 Solid Glass Panel Grid -->
      <section
        class="grid-wrapper"
        id="grid-wrapper"
        role="region"
        aria-label="Select a Curling Game"
      >
        <div class="games-grid" id="games-grid">
          <!-- 9 permanent slots rendered by script.js -->
        </div>
      </section>

      <!-- Spaced Instagram Action Button -->
      <footer class="hub-footer" id="hub-footer">
        <a
          href="https://instagram.com/tileworks_studio"
          id="instagram-link"
          class="instagram-action"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow Tileworks on Instagram"
        >
          <svg
            class="instagram-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span class="sr-only">Instagram</span>
        </a>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
